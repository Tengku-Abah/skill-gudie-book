name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/make_demo.py
      - run: python guidebook.py validate examples/demo.json
      - run: python guidebook.py build examples/demo.json -o output/guidebook.pdf --html --export-images --images-dir output/slides --html-out output/index.html
      - run: python tests/check_artifacts.py output/guidebook.pdf output/index.html
