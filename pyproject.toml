[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "application-guidebook-generator"
version = "0.1.0"
description = "Render application guide specs into widescreen PDF, PNG and offline HTML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1,<13"]

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]
dev = ["PyMuPDF>=1.24,<2", "PyYAML>=6,<7"]

[project.scripts]
guidebook = "guidebook:main"

[tool.setuptools]
py-modules = ["guidebook"]
